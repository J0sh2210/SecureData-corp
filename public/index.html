<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureData Corp - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>SecureData Corp</h1>
            <p>Inicia sesion para continuar</p>

            <div id="alert" class="alert hidden"></div>

            <form id="form-login">
                <div class="form-group">
                    <label for="correo">Correo electronico</label>
                    <input type="email" id="correo" placeholder="tu@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="contrasena">Contrasena</label>
                    <input type="password" id="contrasena" placeholder="Tu contrasena" required>
                </div>
                <button type="submit" class="btn btn-primary">Iniciar Sesion</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const correo = document.getElementById('correo').value.trim();
            const contrasena = document.getElementById('contrasena').value;

            try {
                const resp = await fetch('../api/auth/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, contrasena })
                });
                const datos = await resp.json();

                if (datos.success) {
                    if (datos.redirect) {
                        window.location.href = datos.redirect;
                    } else {
                        mostrarAlerta('Revisa tu correo para iniciar sesion.', 'success');
                    }
                } else {
                    mostrarAlerta(datos.message, 'error');
                }
            } catch (error) {
                mostrarAlerta('Error de conexion', 'error');
            }
        });

        function mostrarAlerta(mensaje, tipo) {
            const alert = document.getElementById('alert');
            alert.textContent = mensaje;
            alert.className = `alert alert-${tipo}`;
        }
    </script>
</body>
</html>
